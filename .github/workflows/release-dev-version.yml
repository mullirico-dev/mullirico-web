name: Bump version and tag on dev merges

on:
  pull_request_target:
    branches: ['dev']
    types: [closed]

permissions:
  contents: write
  pull-requests: read

jobs:
  release-dev-version:
    if: github.event.pull_request.merged == true && github.event.pull_request.head.ref != 'dev' && github.event.pull_request.head.ref != 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev branch
        uses: actions/checkout@v6
        with:
          ref: dev
          token: ${{ secrets.RELEASE_TOKEN || github.token }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Determine bump type
        id: semver
        run: node scripts/get-semver-bump.mjs >> "$GITHUB_OUTPUT"

      - name: Bump package version
        run: npm version "${{ steps.semver.outputs.bump }}" --no-git-tag-version

      - name: Capture new version
        id: version
        run: |
          echo "value=$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")" >> "$GITHUB_OUTPUT"

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore(release): v${{ steps.version.outputs.value }}"

      - name: Create tag
        run: git tag "v${{ steps.version.outputs.value }}"

      - name: Push commit and tag
        run: git push origin HEAD:dev --follow-tags
