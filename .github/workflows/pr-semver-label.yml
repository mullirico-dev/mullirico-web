name: Validate semver label for dev merges

on:
  pull_request:
    branches: ['dev']
    types:
      [
        opened,
        reopened,
        synchronize,
        labeled,
        unlabeled,
        edited,
        ready_for_review,
      ]

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-semver-label:
    if: github.event.pull_request.head.ref != 'dev' && github.event.pull_request.head.ref != 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Validate semver label
        run: node scripts/require-semver-label.mjs
