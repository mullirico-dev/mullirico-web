name: Publish GitHub release for version tags

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Find previous version tag
        id: previous
        run: |
          previous_tag="$(git tag --sort=-version:refname | grep '^v' | grep -vx "${GITHUB_REF_NAME}" | head -n 1 || true)"
          echo "value=${previous_tag}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cmd=(
            gh release create "${GITHUB_REF_NAME}"
            --title "${GITHUB_REF_NAME}"
            --verify-tag
            --generate-notes
          )

          if [ -n "${{ steps.previous.outputs.value }}" ]; then
            cmd+=(--notes-start-tag "${{ steps.previous.outputs.value }}")
          fi

          "${cmd[@]}"
