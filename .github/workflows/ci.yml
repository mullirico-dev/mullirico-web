name: Pull request checks

on:
  pull_request:
    branches: ['dev', 'main']

permissions:
  contents: read

jobs:
  quality-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: make install

      - name: Check formatting
        run: make format-check

      - name: Run unit tests
        run: make test

      - name: Build application
        run: make build
