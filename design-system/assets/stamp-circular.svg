<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="MulliRico stamp">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Allura&family=DM+Sans:wght@400;500&display=swap');
    .wm {
      fill: #1A1714;
      font-family: 'Allura', cursive;
      font-size: 34px;
      font-weight: 400;
    }
    .lbl,
    .sub {
      fill: #1A1714;
      font-family: 'DM Sans', sans-serif;
      text-transform: uppercase;
      letter-spacing: 2px;
    }
    .lbl {
      font-size: 10px;
      font-weight: 500;
    }
    .sub {
      font-size: 8px;
      font-weight: 400;
    }
  </style>
  <defs>
    <path id="topArc" d="M 30,120 A 90,90 0 0 1 210,120" fill="none" />
    <path id="botArc" d="M 36,130 A 84,84 0 0 0 204,130" fill="none" />
  </defs>
  <circle cx="120" cy="120" r="112" fill="none" stroke="#1A1714" stroke-width="1.5" />
  <circle cx="120" cy="120" r="104" fill="none" stroke="#1A1714" stroke-width="0.6" />
  <text class="lbl">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">ARTISAN SOURDOUGH</textPath>
  </text>
  <text class="sub">
    <textPath href="#botArc" startOffset="50%" text-anchor="middle">CYPRESS · TEXAS · EST 2024</textPath>
  </text>
  <text x="120" y="135" text-anchor="middle" class="wm">MulliRico</text>
  <line x1="60" y1="155" x2="180" y2="155" stroke="#1A1714" stroke-width="0.5" />
  <text x="120" y="172" text-anchor="middle" class="sub" style="font-size:8px; letter-spacing:2px;">SLOW · NATURAL · SMALL BATCH</text>
</svg>
